# Imports a sample subscription list through the real file picker, then refreshes every feed.
#
# The OPML is a repository fixture (`${project}` is expanded by the CLI to the checkout's
# path), so this runs on any machine and on CI; test resources must never live outside the
# repo. It lists the live originals of the parser's captured fixture feeds
# (crates/daynews-feed/tests/data), in folders, and is the same
# file the daynews-opml unit tests parse; crates/daynews-opml/tests/data/README.md describes it.
#
# CONTRACT: expects a store that does not already hold these 7 subscriptions; the count
# below covers the whole sidebar, including feeds present before the import. Re-running is
# otherwise safe: feed ids are a hash of the feed URL, so importing twice adds nothing the
# second time.
name: fleet-reader-import
description: Import an OPML file through the real file picker and refresh every feed.
flow:
  - wait_for: { id: nav }
  # On a phone or the web the section is a root list of groups: open it and tap the group's
  # row (`settings/<group>` is the desktop window's route to a tab).
  - navigate: { route: settings/feeds, skip_on: [ios-uikit, android-material, harmony-arkui, web-dom] }
  - navigate: { route: settings, only_on: [web-dom] }
  - toolbar: { item: settings, only_on: [ios-uikit, android-material, harmony-arkui] }
  - tap: { id: prefs_group:feeds, only_on: [ios-uikit, android-material, harmony-arkui, web-dom] }
  - wait_for: { id: opml_import }
  - tap: { id: opml_import }
  - pause: { secs: 1 }
  - respond:
      { path: "${project}/crates/daynews-opml/tests/data/daynews.opml" }
  - pause: { secs: 2 }
  - assert_text: { id: "sidebar:header%3Afeeds", contains: "(7)" }
  - screenshot: { name: imported, window: day.preferences, only_on: [macos-appkit, macos-gtk, macos-qt, linux-gtk, linux-qt, windows-winui] }
  - screenshot: { name: imported, only_on: [ios-uikit, android-material, harmony-arkui, web-dom] }
  - close_window: { window: day.preferences, only_on: [ios-uikit, android-material, harmony-arkui, macos-appkit, macos-gtk, macos-qt, linux-gtk, linux-qt, windows-winui] }
