name: ci

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # Marking a pre-release as a release (or publishing one) rebuilds the website against it.
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      day-main:
        description: Build against day's main branch instead of the newest release
        type: boolean
        default: false
  schedule:
    - cron: "30 2 * * *" # 02:30 Eastern; staggered across daybrite.
      timezone: America/New_York

# The repository's own jobs run this checkout's code with a read-only token. The write grants
# sit on the job that calls the shared workflow, whose release and Pages jobs alone use them;
# its build legs, which run this code too, narrow their token to read-only themselves.
permissions:
  contents: read

jobs:
  # The App Fair's rules: the licence texts, an SPDX line in every Rust file, and the flavor
  # manifest the catalog builds with. Submissions run the same action
  # (https://github.com/appfair/appfair-apps).
  appfair-lint:
    name: appfair-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: appfair/appfair-apps/.github/actions/appfair-lint@main

  app:
    uses: daybrite/actions/.github/workflows/dayapp.yml@v1
    permissions:
      contents: write # release-asset upload on tag builds
      pages: write    # web-dom → GitHub Pages (deploy-web)
      id-token: write # deploy-pages OIDC token (deploy-web)
    secrets: inherit
    with:
      targets: windows-winui, macos-appkit, linux-gtk, linux-qt, ios-uikit, android-material, harmony-arkui, web-dom
      # A tag and the nightly run build against the newest day release; a push builds against
      # day's main branch, as does a manual run that asks for it. The revision is resolved once
      # per run, so every leg compiles the same one.
      day-deps: ${{ inputs.day-main && 'main' || 'auto' }}
      scripts: dayscript/seed-demo.yaml dayscript/reader-swipes.yaml dayscript/walkthrough.yaml dayscript/http-interception.yaml
      launch-env: DAY_NEWS_HTTP_TEST=1 DAY_NEWS_SYNC_TEST=1 DAY_NEWS_SYNC_TEST_LATENCY_MS=1500
      preflight-checks: fmt test
      locales: en
      deploy-web: true
      # A tag publishes a pre-release. The App Fair queue builds the same tag, compares its
      # packages with this release's, and marks the release Latest once the stores have it.
      release-mode: pre-release
      # HarmonyOS runs on the phone panel only for now. The default tablet row (a 1280×800
      # panel on the same emulator image) kills the walkthrough intermittently inside ArkWeb's
      # in-process GPU thread as the article web view comes up: `Chrome_InProcGp →
      # __assert_fail → kms_swrast_dri.so!draw_flush`, a Mesa software-rasterizer assertion in
      # the OpenHarmony 7.0 image itself, not in the app or in Day (run 37461094639, job
      # 112287771067; Stanza-Redux's tablet row dies the same way). The phone panel passes.
      # Restore the second row once the emulator image's GPU stack is fixed:
      #   device=tablet, orientation=landscape, slug=tablet
      harmony-devices: |
        device=phone, orientation=portrait, slug=phone

