[package]
name = "daynews-core"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[features]
# Optional legacy provider; existing account data remains intact when disabled.
feedbin = []
experimental-webdav = ["daynews-db/experimental-webdav", "dep:serde", "dep:serde_json", "dep:zeroize"]

[dependencies]
zeroize = { version = "1.9", features = ["serde"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
daynews-sync = { path = "../daynews-sync" }
daynews-credentials = { path = "../daynews-credentials" }
day-async = "0.6"
log = "0.4"
futures-util = "0.3"
daynews-db = { path = "../daynews-db" }
daynews-time = { path = "../daynews-time" }
daynews-feed = { path = "../daynews-feed" }
daynews-opml = { path = "../daynews-opml" }
# The view-model publishes signals derived from live queries: standing effects bridge the
# container's queries and count badges into the value shapes the UI binds. day-core supplies
# the main-loop executor (`day::task`) the refresh loop runs on; no async runtime is involved.
day-reactive = "0.6"
day-core = "0.6"
day-model = "0.6"
# From git with daynews-db (see its manifest) until a day-persistence release has day-sync's seam.
day-persistence = { git = "https://github.com/daybrite/day-persistence.git" }
# The bundled demo feeds are written per language: `fetch_feed` reads the set for the locale the
# app resolved (resource/assets/demo/README.md).
day-localization = "0.6"
# `storage::{data_dir, cache_dir}`: where the library and the feed icons live (`store_dir`).
day-spec = "0.6"

[dev-dependencies]
tempfile = "3"
