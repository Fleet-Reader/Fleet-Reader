# Day.toml: the Day project manifest (https://daybrite.dev/docs/reference/cli).
#
# `name` and `version` come from Cargo.toml's [package]; they are never restated here.
# Any [app] property can be overridden per platform ([app.ios]), per toolkit ([app.qt]),
# or per target ([app.macos-appkit]); the most specific table wins.
schema = 1
url_schemes = ["feed", "feeds", "rss", "atom", "web+feed"]

[[file_types]]
extensions = ["rss"]
mime_types = ["application/rss+xml"]
apple_uti = "org.rss.rss"

[[file_types]]
extensions = ["atom"]
mime_types = ["application/atom+xml"]
apple_uti = "org.atom.atom"

[app]
id = "org.appfair.app.FleetReader"
# The deep-link scheme (docs/deep-links.md). Left explicit because the default is the id's
# last segment, and a scheme takes no capitals.
scheme = "fleetreader"
title = "Fleet Reader"
build = 8
targets = ["macos-appkit", "macos-gtk", "macos-qt", "windows-winui", "ios-uikit", "android-material", "web-dom", "harmony-arkui"]

[window]
width = 1440
height = 900

# Native host customization; build projects are generated by Day.
[android]
cleartext-traffic = true
